<meta charset="utf-8"><title>Meet DOM simulator</title>
<div id="err" style="position:fixed;bottom:0;left:0;right:0;background:#fdd;color:#900;font:12px monospace;z-index:99;padding:4px"></div>

<!-- 実測: Meet はスクリーンリーダー用に画面外のライブリージョンを持つ（字幕本体ではない） -->
<div aria-atomic="true" aria-live="polite" data-mdc-dom-announce="true"
     style="position:absolute;top:-9999px;inset-inline-start:-9999px;height:1px;overflow:hidden">自動字幕起こしがオンになっています</div>
<div role="status" aria-live="polite" style="position:absolute;top:-9999px;height:1px;overflow:hidden">読み込み中...</div>

<div style="background:#202124;color:#fff;min-height:100vh;padding:20px;font-family:sans-serif">
  <h3>Meet DOM simulator（実測 DOM 準拠 / 難読化クラスなし / Trusted Types 有効）</h3>

  <!-- 実測で存在したおとり群 -->
  <div role="combobox" aria-label="字幕の種類" style="display:inline-block;border:1px solid #666;padding:4px">字幕を表示</div>
  <ul role="listbox" aria-label="字幕の種類" style="display:inline-block;border:1px solid #666;padding:4px;list-style:none">
    <li>字幕を表示</li><li>字幕の翻訳</li></ul>
  <button aria-label="字幕設定を開く">settings</button>
  <button id="cc" aria-label="字幕をオフにする">closed_caption</button>
  <span id="ccstate" style="margin-left:8px;color:#8f8">captions: on</span>

  <!-- 字幕とは無関係な role=region（実機ではこれを掴んでしまっていた） -->
  <div role="region" aria-label="会議の詳細" style="border:1px solid #666;padding:8px;margin-top:8px">
    会議コード ohy-uxgv-vne / 参加者 2 名</div>

  <div id="mount" style="margin-top:12px"></div>
</div>
<script>
window.MCF_FORCE = true;
const err = document.getElementById('err');
window.addEventListener('error', e => { err.textContent += ' ERROR: ' + e.message; });

const q = location.search;
const SPEAKERS = ['あなた', '田中太郎'];
const WORDS = ['テストテスト。', 'aria-label ベースで検出できるか確認中。', '長い発話が続くと折り返します。'];
const ccBtn = document.getElementById('cc');
const ccState = document.getElementById('ccstate');
let inner = null, tail = null, span = null, n = 0, buf = '', iv = null;

/* 実測構造:
   <div class="nMcdL">
     <div class="adE6rb"><img alt=""><div class="KcIKyf"><span>あなた</span></div></div>
     <div class="ygicle VbkSUe">本文…</div>
   </div>
   アバターの alt は空なので、名前は「img と同じ枝にある」ことで判定させる */
function newRow(name) {
  const r = document.createElement('div'); r.className = 'nMcdL bj4p3b';
  const head = document.createElement('div'); head.className = 'adE6rb';
  const av = document.createElement('img'); av.alt = ''; av.width = 12; av.height = 12;
  const nmWrap = document.createElement('div'); nmWrap.className = 'KcIKyf jxFHg';
  const nm = document.createElement('span'); nm.textContent = name; nm.style.color = '#aaa';
  nmWrap.appendChild(nm); head.appendChild(av); head.appendChild(nmWrap);
  const body = document.createElement('div'); body.className = 'ygicle VbkSUe';
  r.appendChild(head); r.appendChild(body); inner.insertBefore(r, tail);
  const live = inner.querySelectorAll('.nMcdL');
  if (live.length > 3) live[0].remove();
  return body;
}
function tick() {
  n++;
  buf += WORDS[n % WORDS.length].slice(0, 8);
  span.textContent = buf;
  if (n % 4 === 0) {
    buf = '';
    if (q.includes('recycle')) {
      /* Meet が同じ行ノードを再利用して別の発話に差し替えるケースの再現。
         DOM ノードは変えずに話者名と本文だけを丸ごと置き換える */
      const row = inner.querySelectorAll('.nMcdL')[0];
      row.querySelector('.KcIKyf span').textContent = SPEAKERS[(n / 4) % 2];
      span = row.querySelector('.ygicle');
      span.textContent = '';
    } else {
      span = newRow(SPEAKERS[(n / 4) % 2]);
    }
  }
}
/* 実測どおり: role="region" + aria-label="字幕"、内側に aria-live は無い。
   「最新の字幕に移動」ボタンがリージョン内に同居する */
function mountRegion() {
  const region = document.createElement('div');
  region.setAttribute('role', 'region');
  region.setAttribute('aria-label', q.includes('en') ? 'Captions' : '字幕');
  region.className = 'VYBDae-random-123';
  region.style.cssText = 'background:#000;padding:12px;min-height:120px';
  /* 実測: リージョン直下は [発話行..., 非表示の空div, 「最新の字幕に移動」ボタン] が並ぶ。
     ボタン内の aria-hidden なアイコン文字とツールチップ文字を発話として拾わないことを確認する */
  const hidden = document.createElement('div');
  hidden.appendChild(Object.assign(document.createElement('div'), { className: 'GvZY2' })).style.display = 'none';
  const jumpWrap = document.createElement('div'); jumpWrap.className = 'IMKgW';
  const jump = document.createElement('button');
  jump.setAttribute('aria-label', '最新の字幕に移動');
  const icon = document.createElement('i'); icon.className = 'google-symbols';
  icon.setAttribute('aria-hidden', 'true'); icon.textContent = 'arrow_downward';
  const tip = document.createElement('span'); tip.setAttribute('aria-hidden', 'true'); tip.textContent = '一番下に移動';
  jump.appendChild(icon); jump.appendChild(tip); jumpWrap.appendChild(jump);
  region.appendChild(hidden); region.appendChild(jumpWrap);
  document.getElementById('mount').appendChild(region);
  inner = region;        /* 実測どおり発話行はリージョン直下 */
  tail = hidden;         /* 新しい行はこの前に挿入する */

  span = newRow(SPEAKERS[0]);
  for (let i = 0; i < 14; i++) tick();          /* スクリーンショット用に同期で数発話ぶん作る */
  iv = setInterval(() => { tick(); if (n > 60) clearInterval(iv); }, 400);
}

ccBtn.addEventListener('click', () => {
  const label = ccBtn.getAttribute('aria-label');
  const on = label.includes('オフ') || /Turn off/i.test(label);
  if (on) {
    if (iv) clearInterval(iv);
    document.getElementById('mount').textContent = '';
    ccBtn.setAttribute('aria-label', q.includes('en') ? 'Turn on captions' : '字幕をオンにする');
    ccState.textContent = 'captions: off'; ccState.style.color = '#f88';
  } else {
    ccBtn.setAttribute('aria-label', q.includes('en') ? 'Turn off captions' : '字幕をオフにする');
    ccState.textContent = 'captions: on (ボタン経由で ON)'; ccState.style.color = '#8f8';
    n = 0; buf = '';
    mountRegion();
  }
});

if (q.includes('en')) {
  ccBtn.setAttribute('aria-label', 'Turn off captions');
  document.querySelectorAll('[aria-label="字幕の種類"]').forEach(e => e.setAttribute('aria-label', 'Caption type'));
  document.querySelector('button[aria-label="字幕設定を開く"]').setAttribute('aria-label', 'Open caption settings');
}
if (q.includes('ccoff')) {
  ccBtn.setAttribute('aria-label', q.includes('en') ? 'Turn on captions' : '字幕をオンにする');
  ccState.textContent = 'captions: off'; ccState.style.color = '#f88';
} else {
  mountRegion();
}
</script>
<script src="meet-caption-fullscreen.js"></script>
<script>
if (q.includes('autoclick')) {
  const btns = [...document.querySelectorAll('#mcf-bar button')];
  ['plus','plus','minus','copy','copylog','log'].forEach(a => {
    try { btns.find(b=>b.dataset.a===a).click(); }
    catch(e){ err.textContent += ' CLICK_ERROR('+a+'): '+e.message; }
  });
}
</script>
